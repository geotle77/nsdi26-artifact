model:
  hidden_dims: [512, 256, 128]
  dropout_rate: 0.3
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss_type: pointwise
  neg_sample_k: 100

training:
  max_epochs: 100
  batch_size: 1024  # 保留用于兼容性，训练时实际使用queries_per_batch
  queries_per_batch: 2  # 每个batch包含的query数量，pairwise建议多一些query以增加对比多样性
  patience: 10
  num_workers: 4

data_split:
  test_ratio: 0.2
  validation_ratio: 0.1

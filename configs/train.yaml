model:
  hidden_dims: [512, 256, 128]
  dropout_rate: 0.3
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss_type: pointwise
  neg_sample_k: 100

training:
  max_epochs: 100
  batch_size: 1024  # Kept for compatibility; batching is query-based.
  queries_per_batch: 2  # Number of queries per batch.
  monitor_metric: val_recall@5pct_mean
  monitor_mode: max
  patience: 10
  num_workers: 4

data_split:
  test_ratio: 0.2
  validation_ratio: 0.1
